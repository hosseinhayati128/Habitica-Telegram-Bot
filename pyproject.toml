[project]
name = "habitica-telegram-bot"
version = "1.0.0"
description = "Unofficial Habitica bot for Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Flask>=3.1,<4",
    "python-telegram-bot>=22,<23",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "Avatar",
    "habitica-avatar.bundle.js",
    "node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
